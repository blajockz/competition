# nginx example (HTTPS certificates managed by you, e.g. certbot).
# Replace competition.example.com with your domain.
server {
    listen 443 ssl http2;
    server_name competition.example.com;

    ssl_certificate     /etc/letsencrypt/live/competition.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/competition.example.com/privkey.pem;

    # live updates (Server-Sent Events): no buffering, long timeout
    location /api/stream {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name competition.example.com;
    return 301 https://$host$request_uri;
}
