# Use this instead of docker-compose.yml if the server already runs a reverse
# proxy (nginx, Traefik, Apache…) that handles HTTPS. The app listens on
# 127.0.0.1:8080 only; see deploy/nginx.conf for an nginx example.
#   docker compose -f deploy/docker-compose.no-caddy.yml up -d --build
services:
  app:
    build: ..
    image: competition-platform:latest
    restart: unless-stopped
    env_file: ../.env
    environment:
      TRUST_PROXY: "true"
    volumes:
      - app-data:/data
    ports:
      - "127.0.0.1:8080:8080"
    stop_grace_period: 15s

volumes:
  app-data:
